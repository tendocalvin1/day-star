services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-daystar_daycare}
      POSTGRES_USER: ${POSTGRES_USER:-daystar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-daystar_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - daystar_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: ./daystar-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      DATABASE_URL: ${DATABASE_URL}
      DB_SSL: "false"
      SWAGGER_ENABLE: ${SWAGGER_ENABLE:-false}
    ports:
      - "${API_PORT:-5000}:5000"
    command: sh -c "npm run migrate && node src/server.js"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5000/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  daystar_postgres_data:
